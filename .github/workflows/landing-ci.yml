name: landing-ci

on:
  pull_request:
    paths:
      - 'landing/**'
      - 'scripts/agents/gates.mjs'
      - '.github/workflows/landing-ci.yml'
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'scripts/agents/gates.mjs'
      - '.github/workflows/landing-ci.yml'

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
        working-directory: landing
      - run: npx playwright install --with-deps chromium
        working-directory: landing
      - run: node scripts/agents/gates.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gates-${{ github.sha }}
          path: |
            landing/test-results/
            landing/playwright-report/
          retention-days: 7
